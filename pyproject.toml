[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rp-tts-engine"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "httpx[socks]",
    "chromadb",
    "pyyaml",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy",
]

[project.optional-dependencies]
mlx = ["mlx-lm", "mlx-audio", "mlx-embeddings"]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[project.scripts]
rp-tts = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
